name: Knowledge RFC checks
on:
  pull_request:
  push:
    branches: [work/2026-09-09-knowledge]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.2.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run hillclimb
      - if: failure()
        run: 'echo "OBSERVATION: Verification failed. FEELING: concerned. NEED: contract integrity. REQUEST: Read the failed check and repair it before review."'
